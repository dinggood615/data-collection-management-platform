# Replace the certificate paths and port if your deployment differs.
server {
    listen 5555 ssl;
    server_name _;

    ssl_certificate     /etc/tender-platform/tls/cert.pem;
    ssl_certificate_key /etc/tender-platform/tls/key.pem;
    client_max_body_size 2m;

    # The FastAPI application remains the single source of administrator
    # authentication. Nginx calls this internal endpoint before proxying both
    # the dashboard and noVNC, including WebSocket upgrades.
    location = /_platform_auth {
        internal;
        proxy_pass http://127.0.0.1:8000/_internal/auth-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Original-URI $request_uri;
    }

    location = /manual-verify {
        return 302 /manual-verify/vnc.html?autoconnect=1;
    }

    location /manual-verify/ {
        auth_request /_platform_auth;
        proxy_pass http://127.0.0.1:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600;
    }

    location / {
        auth_request /_platform_auth;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
    }
}
